services:
  # FastAPI Backend Service
  - type: web
    name: darukaa-earth-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://darukaa.earth,https://darukaa-earth.vercel.app,http://localhost:5173

  # React / Vite Static Site
  - type: web
    name: darukaa-earth-web
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: darukaa-earth-api
          property: host
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false

databases:
  # PostgreSQL 16 with PostGIS extension
  - name: darukaa-postgis
    databaseName: darukaa_production
    user: darukaa_admin
    region: oregon
    plan: starter
    postgresMajorVersion: 16
